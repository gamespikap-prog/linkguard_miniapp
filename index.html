<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>LinkGuard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">LG</div>
        <div>
          <div class="brand-name">LinkGuard</div>
          <div class="brand-sub">GAME HUB</div>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn hidden" id="adminBtn" aria-label="Админка">⚙️</button>
        <button class="icon-btn" id="soundBtn" aria-label="Музыка">♫</button>
      </div>
    </header>

    <main class="content">
      <section class="games-section" id="gamesSection"></section>
      <section class="page-view hidden" id="subPage">
        <div id="subPageContent"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="games"><span class="nav-icon">🎮</span><span>Игры</span></button>
      <button class="nav-item" data-tab="top"><span class="nav-icon">🏆</span><span>Топ</span></button>
      <button class="nav-item" data-tab="profile"><span class="nav-icon">👤</span><span>Профиль</span></button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
