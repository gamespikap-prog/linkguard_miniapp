<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>LinkGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">LG</div>
        <div>
          <div class="brand-name">LinkGuard</div>
          <div class="brand-sub">GAME HUB</div>
        </div>
      </div>
      <button class="icon-btn" id="soundBtn" aria-label="Звук">♪</button>
    </header>

    <main class="content">
      <section class="hero-card">
        <div class="hero-glow"></div>
        <div class="hero-text">
          <span class="eyebrow">LINKGUARD 2.0</span>
          <h1 id="welcomeTitle">Добро пожаловать</h1>
          <p>Играй, собирай награды и поднимайся в рейтинге.</p>
        </div>
        <div class="balance-pill">
          <span>◆</span>
          <strong id="balanceValue">0</strong>
          <small>очков</small>
        </div>
      </section>

      <section class="section" id="gamesSection">
        <div class="section-head">
          <div>
            <span class="section-kicker">АРКАДА</span>
            <h2>Игры</h2>
          </div>
          <span class="live-dot">● LIVE</span>
        </div>

        <div class="game-grid">
          <button class="game-card mines" data-page="mines">
            <div class="game-icon">💣</div>
            <div class="game-info">
              <h3>Mines</h3>
              <p>Рискни и дойди до конца</p>
            </div>
            <span class="arrow">›</span>
          </button>

          <button class="game-card duel" data-page="duel">
            <div class="game-icon">⚔️</div>
            <div class="game-info">
              <h3>PvP Дуэль</h3>
              <p>Сразись с другим игроком</p>
            </div>
            <span class="arrow">›</span>
          </button>

          <button class="game-card cases" data-page="cases">
            <div class="game-icon">🎁</div>
            <div class="game-info">
              <h3>Кейсы</h3>
              <p>Ежедневные награды и бонусы</p>
            </div>
            <span class="arrow">›</span>
          </button>
        </div>
      </section>

      <section class="quick-row">
        <button class="quick-card" data-tab="top">
          <span>🏆</span><div><b>Топ игроков</b><small>Рейтинг недели</small></div><i>›</i>
        </button>
        <button class="quick-card" data-tab="profile">
          <span>👤</span><div><b>Профиль</b><small>Статистика и предметы</small></div><i>›</i>
        </button>
      </section>

      <div class="page-view hidden" id="subPage">
        <button class="back-btn" id="backBtn">‹ Назад</button>
        <div id="subPageContent"></div>
      </div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="games">
        <span class="nav-icon">🎮</span><span>Игры</span>
      </button>
      <button class="nav-item" data-tab="top">
        <span class="nav-icon">🏆</span><span>Топы</span>
      </button>
      <button class="nav-item" data-tab="profile">
        <span class="nav-icon">👤</span><span>Профиль</span>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
