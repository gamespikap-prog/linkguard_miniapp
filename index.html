<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>LinkGuard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">LG</div>
        <div>
          <div class="brand-name">LinkGuard</div>
          <div class="brand-sub">GAME HUB</div>
        </div>
      </div>
      <button class="icon-btn" id="soundBtn" aria-label="Музыка">♫</button>
    </header>

    <main class="content">
      <section class="balance-area">
        <div class="balance-orb">
          <div class="balance-star">★</div>
          <span>БАЛАНС</span>
          <strong id="balanceValue">0</strong>
          <small>очков</small>
        </div>
        <button class="top-up-btn" id="topUpBtn">Пополнить</button>
      </section>

      <section class="games-section" id="gamesSection">
        <div class="section-head">
          <div>
            <span class="section-kicker">АРКАДА</span>
            <h2>Игры</h2>
          </div>
        </div>

        <div class="featured-games">
          <button class="featured-card daily" data-page="daily">
            <div class="featured-icon">🎁</div>
            <div class="featured-info">
              <span class="card-tag">БЕСПЛАТНО</span>
              <h3>Бесплатный кейс</h3>
              <p>Открывай один раз в день</p>
            </div>
            <span class="card-arrow">›</span>
          </button>

          <button class="featured-card cases" data-page="cases">
            <div class="featured-icon">🎁</div>
            <div class="featured-info">
              <span class="card-tag">НАГРАДЫ</span>
              <h3>Кейсы</h3>
              <p>Редкие награды и ресурсы</p>
            </div>
            <span class="card-arrow">›</span>
          </button>

          <button class="featured-card mines" data-page="mines">
            <div class="featured-icon">💣</div>
            <div class="featured-info">
              <span class="card-tag">GAME</span>
              <h3>Мины</h3>
              <p>Открывай клетки и забирай банк</p>
            </div>
            <span class="card-arrow">›</span>
          </button>

          <button class="featured-card duel" data-page="duel">
            <div class="featured-icon">⚔️</div>
            <div class="featured-info">
              <span class="card-tag">PVP</span>
              <h3>PvP Дуэль</h3>
              <p>Сражение с игроком</p>
            </div>
            <span class="card-arrow">›</span>
          </button>
        </div>
      </section>

      <section class="page-view hidden" id="subPage">
        <button class="back-btn" id="backBtn">‹ Назад</button>
        <div id="subPageContent"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Главная навигация">
      <button class="nav-item active" data-tab="games">
        <span class="nav-icon">🎮</span><span>Игры</span>
      </button>
      <button class="nav-item" data-tab="top">
        <span class="nav-icon">🏆</span><span>Топы</span>
      </button>
      <button class="nav-item" data-tab="profile">
        <span class="nav-icon">👤</span><span>Профиль</span>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
